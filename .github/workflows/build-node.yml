name: Build Node dev container

on:
  push:
    branches:
      - main
    paths:
      - "node/**"
      - ".github/workflows/build-node.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Node dev container
        uses: devcontainers/ci@v0.3
        with:
          configFile: node/devcontainer.json
          imageName: ghcr.io/jakemccann/devcontainers-node
          push: always
